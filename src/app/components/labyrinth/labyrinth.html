<div class="bg-black">
  @if (generated) {
    <div class="flex flex-row">
      @for (dx of [].constructor(width); track $index; let x = $index) {
        <div class="flex flex-col bg-white">
          @for (dy of [].constructor(height); track $index; let y = $index) {
            <app-labyrinth-field-component
              [field]="getFieldAt(x, y)"
            ></app-labyrinth-field-component>
          }
        </div>
      }
    </div>
  }
</div>
